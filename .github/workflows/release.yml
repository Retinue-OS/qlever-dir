name: Release

# qlever-dir versions follow QLever's (see "Versioning" in README.md):
# - a push to main that pins a QLever release with no vX.Y.Z yet publishes
#   vX.Y.Z, matching that QLever release;
# - a manual run on a pin that already has vX.Y.Z publishes the next fix
#   release vX.Y.Z.N.

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          pin() {
            grep -oP '^FROM docker\.io/adfreiburg/qlever:\K[0-9]+(\.[0-9]+)+(?=@)' || true
          }
          QLEVER=$(pin < Dockerfile)
          if [ -z "$QLEVER" ]; then
            echo "Could not read the pinned QLever version from Dockerfile" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/v${QLEVER}" >/dev/null; then
            TAG="v${QLEVER}"
          elif [ "$EVENT" = "push" ]; then
            # Other Dockerfile changes on a released pin ship as a fix
            # release, published by hand.
            echo "v${QLEVER} already exists; run this workflow by hand for a fix release"
            exit 0
          else
            # Next fix release on the current pin: vX.Y.Z.N+1
            LAST=$(git tag --list "v${QLEVER}.*" \
              | grep -E "^v${QLEVER//./\\.}\.[0-9]+$" \
              | sed "s/^v${QLEVER//./\\.}\.//" | sort -n | tail -1)
            TAG="v${QLEVER}.$(( ${LAST:-0} + 1 ))"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "$TAG already exists; nothing to release" >&2
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "qlever=$QLEVER" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG on QLever $QLEVER"

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          QLEVER: ${{ steps.version.outputs.qlever }}
        run: |
          NOTES=$(printf 'Built on QLever %s (`adfreiburg/qlever:%s`): https://github.com/ad-freiburg/qlever/releases/tag/v%s' \
            "$QLEVER" "$QLEVER" "$QLEVER")
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES" \
            --generate-notes
