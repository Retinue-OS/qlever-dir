user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Upstream block is written dynamically by orchestrator
    include /run/nginx-upstream.conf;

    server {
        listen 7001;
        server_name _;

        location / {
            # Keep the published endpoint structurally read-only: QLever
            # gates writes and admin commands behind the access token the
            # orchestrator generates (reads are anonymous), and the
            # orchestrator talks to the slots directly on 7101/7102 —
            # nothing legitimate ever presents a token on 7001. Refuse any
            # request that tries, so even a leaked token is useless here.
            # (An access token inside a form-encoded POST body cannot be
            # seen without body inspection; the token staying secret — and
            # out of the logs — remains the control for that channel.)
            if ($args ~* "(^|&)access-token=") { return 403; }
            if ($http_authorization != "") { return 403; }
            proxy_set_header Authorization "";

            proxy_pass http://qlever_active;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }
    }
}
